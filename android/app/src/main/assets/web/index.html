<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Road Sensor 지도</title>
  <style>
    /* 차량 기본 글꼴(Pleos: Asta Sans). 앱이 시스템 글꼴 파일을 넘겨준다(WebMapRenderer·SystemSansFont).
       못 받으면(차량 밖 브라우저 등) 다음 글꼴로 넘어간다 */
    @font-face { font-family: "Vehicle Sans"; src: url("system-fonts/sans-400"); font-weight: 400; font-display: block; }
    @font-face { font-family: "Vehicle Sans"; src: url("system-fonts/sans-600"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Vehicle Sans"; src: url("system-fonts/sans-700"); font-weight: 700; font-display: block; }
    :root { color-scheme: dark; --bg: #0b0f14; --panel: rgba(13, 18, 25, 0.92); --line: rgba(255, 255, 255, 0.08); --text: #e8edf2; --sub: #8a96a3; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
      font-family: "Vehicle Sans", system-ui, "Noto Sans CJK KR", sans-serif; -webkit-user-select: none; user-select: none;
      /* 한글은 단어 단위로 줄을 바꾼다("켰습니" / "다"처럼 끊기지 않게). 너무 긴 단어만 글자 단위로 */
      word-break: keep-all; overflow-wrap: anywhere; }
    #map, #map canvas { position: absolute; inset: 0; display: block; }
    #panel { position: absolute; left: 0; top: 0; bottom: 0; width: clamp(340px, 30vw, 760px); padding: 3.5vh 32px 3vh;
      background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2vh; }
    h1 { margin: 0; font-size: clamp(18px, 2.6vh, 28px); font-weight: 600; color: var(--sub); letter-spacing: 0.02em; }
    /* 넘치는 알림은 카드째 숨기고 "외 n건"으로 줄인다(Panel.fitAlerts). 가까운 것부터 보이므로 위가 중요하다 */
    #alerts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1.2vh;
      flex: 0 1 auto; min-height: 0; overflow: hidden; }
    #alerts li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 14px; padding: 1.4vh 18px; border-radius: 12px; flex-shrink: 0;
      background: rgba(255, 255, 255, 0.04); border-left: 8px solid var(--c); }
    #alerts b { font-size: clamp(20px, 3.4vh, 36px); font-weight: 700; white-space: nowrap; }
    #alerts span { font-size: clamp(18px, 3vh, 32px); white-space: nowrap; }
    #alerts small { font-size: clamp(14px, 2.2vh, 24px); color: var(--sub); }
    #alerts li.compact { flex-wrap: nowrap; gap: 0 10px; padding: 0.9vh 14px; border-left-width: 6px; overflow: hidden; }
    /* 두 번째부터의 알림도 주요 정보라 5mm(약 32px, 160dpi) 가까이 둔다(Pleos UI 가이드: 주요 5mm, 보조 3mm 이상) */
    #alerts li.compact b, #alerts li.compact span { font-size: clamp(17px, 2.6vh, 30px); }
    #alerts li.compact span { overflow: hidden; text-overflow: ellipsis; }
    #alerts li.more { display: block; padding: 0 18px; background: none; border: 0; font-size: clamp(14px, 2.2vh, 24px); color: var(--sub); }
    section { display: flex; flex-direction: column; gap: 2vh; min-height: 0; }
    section[hidden], [hidden] { display: none !important; }
    #car-rows { display: grid; grid-template-columns: auto 1fr; gap: 1.2vh 24px; margin: 0; font-size: clamp(18px, 3vh, 30px); }
    #car-rows dt { color: var(--sub); }
    #car-rows dd { margin: 0; }
    .note { padding: 1.6vh 18px; border-radius: 12px; background: rgba(77, 225, 255, 0.08); border-left: 8px solid #4de1ff;
      font-size: clamp(16px, 2.6vh, 26px); }
    .note p { margin: 0.8vh 0 0; }
    .note .sub { color: var(--sub); font-size: clamp(13px, 1.9vh, 20px); }
    #empty { margin: 0; font-size: clamp(18px, 3vh, 32px); color: var(--sub); }
    footer { margin-top: auto; display: flex; flex-direction: column; gap: 1.2vh; font-size: clamp(14px, 2vh, 22px); color: var(--sub); }
    #legend { display: flex; flex-wrap: wrap; gap: 8px 18px; }
    .key::before { content: ""; display: inline-block; width: 18px; height: 18px; margin-right: 6px; vertical-align: -3px;
      background: var(--c); border-radius: 3px; }
    .key.ring::before { background: transparent; border: 3px solid var(--c); }
    .key.dot::before { border-radius: 50%; }
    .key.line::before { width: 22px; height: 6px; border-radius: 3px; vertical-align: 3px; }
    #status.offline { color: #ff8a8a; }
    /* 앞 5km 막대: 아래가 내 차, 위가 5km. 지도와 같은 방향(위 = 앞)이다 */
    #strip { position: relative; display: flex; gap: 10px; height: 26vh; min-height: 120px; flex-shrink: 0; }
    #bar { position: relative; width: 28px; border-radius: 8px; background: rgba(207, 216, 227, 0.14); overflow: hidden; }
    #bar .seg { position: absolute; left: 0; right: 0; background: var(--c); }
    #bar .seg.thin { left: auto; width: 45%; }
    #ticks { position: relative; flex: 1; font-size: clamp(14px, 1.8vh, 20px); color: var(--sub); }
    #ticks span { position: absolute; left: 0; transform: translateY(50%); white-space: nowrap; }
    #ticks span.hit { color: var(--text); }
    #strip-note { margin: 0; font-size: clamp(14px, 1.8vh, 20px); color: var(--sub); }
    #attribution { position: absolute; right: 12px; bottom: 6px; margin: 0; font-size: 12px; color: rgba(232, 237, 242, 0.45); }
    #notice { position: absolute; left: clamp(340px, 30vw, 760px); right: 0; top: 45%; text-align: center; font-size: 32px; color: var(--sub); }
  </style>
</head>
<body>
  <div id="map"></div>
  <p id="notice" hidden></p>
  <p id="attribution"></p>
  <aside id="panel">
    <section id="road">
      <h1>진행 방향 앞</h1>
      <div id="strip">
        <div id="bar"></div>
        <div id="ticks"></div>
      </div>
      <p id="strip-note" hidden>내비 경로를 몰라 진행 방향 직선으로 봅니다</p>
      <ol id="alerts"></ol>
      <p id="empty" hidden></p>
    </section>
    <section id="car" hidden>
      <h1>내 차</h1>
      <dl id="car-rows"></dl>
      <div class="note">
        <b>내가 보내는 신호</b>
        <p id="sending"></p>
        <p class="sub">원본 위치 대신 약 150m 격자 ID만 보냅니다. 같은 격자를 지난 차가 3대 이상일 때만 지도에 나타납니다.</p>
      </div>
    </section>
    <footer>
      <div id="legend"></div>
      <div id="status"></div>
    </footer>
  </aside>
  <script src="roads.js"></script>
  <script src="map.js"></script>
</body>
</html>
